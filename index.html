    <script>
      (() => {
        try {
          const root = document.documentElement;
          const storedTheme = localStorage.getItem("hongyunx.atlas.theme");
          const mode = ["light", "dark", "system"].includes(storedTheme) ? storedTheme : "system";
          const theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
          const storedLanguage = localStorage.getItem("hongyunx.atlas.language");
          const language = ["zh-CN", "en"].includes(storedLanguage) ? storedLanguage : (navigator.language.toLowerCase().startsWith("zh") ? "zh-CN" : "en");
          const storedMotion = localStorage.getItem("hongyunx.atlas.motion");
          const motion = storedMotion === "on" || storedMotion === "off" ? storedMotion : (matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on");
          root.dataset.theme = theme;
          root.dataset.themeMode = mode;
          root.dataset.motion = motion;
          root.dataset.language = language;
          root.lang = language;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#070b0a" : "#f4f8f7");
        } catch {}
      })();
    </script>
